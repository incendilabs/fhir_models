name: FHIR Model Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'incendilabs/fhir_models'
    name: FHIR ${{ matrix.fhir-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - fhir-version: R4
            suite: r4
          - fhir-version: R4B
            suite: r4b
          - fhir-version: R5
            suite: r5

    steps:
      - name: Checkout fhir_models
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.13'

      - name: Install test dependencies
        run: |
          gem install --no-document \
            bcp47:0.3.3 \
            date_time_precision:0.8.1 \
            mime-types:3.7.0 \
            nokogiri:1.19.4 \
            nokogiri-diff:0.3.0 \
            pry:0.15.2 \
            simplecov:0.22.0 \
            test-unit:3.7.7

      - name: Run FHIR ${{ matrix.fhir-version }} test suite
        run: ruby -Ilib -Itest test/run_version_suite.rb ${{ matrix.suite }}
